<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الجرعات · Dose Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#14231f;--mut:#5f736d;--pri:#0f8b6d;--pri2:#e3f4ef;--bd:#dbe5e2;--dng:#c0392b;--sh:0 1px 3px rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#17221f;--tx:#e8f2ef;--mut:#93a8a1;--pri:#2fc29b;--pri2:#173a31;--bd:#26362f;--dng:#ff7b6b;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#17221f;--tx:#e8f2ef;--mut:#93a8a1;--pri:#2fc29b;--pri2:#173a31;--bd:#26362f;--dng:#ff7b6b;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:700}
button{font-family:inherit;font-size:15px;cursor:pointer;border:0;border-radius:12px}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
#cam{position:relative;height:150px;border-radius:16px;overflow:hidden;background:#000;margin-bottom:10px}
#cam video{width:100%;height:100%;object-fit:cover}
#camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:10px;font-size:14px;background:rgba(0,0,0,.35)}
#camBtn{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.55);color:#fff;padding:4px 12px;font-size:13px;z-index:2}
.frame{position:absolute;inset:22px 18%;border:2px solid #2fc29b;border-radius:12px;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select{width:100%;font-family:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-height:46px}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1}
.add{background:var(--pri);color:#fff;font-weight:700;padding:0 18px;min-height:46px}
.drug{display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:700;font-size:18px;word-break:break-word}
.meta{font-size:13px;color:var(--mut)}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:8px;padding:0 8px;font-weight:700;font-size:13px;direction:ltr}
.res{background:var(--pri2);border-radius:12px;padding:10px 12px}
.res b{font-size:24px;color:var(--pri);direction:ltr;unicode-bidi:isolate;display:inline-block}
.res span{display:block;font-size:14px;color:var(--mut)}
.hint{font-size:14px;color:var(--mut);background:var(--bg);border-radius:12px;padding:8px 12px}
.act{display:flex;gap:6px}
.act button{background:var(--bg);color:var(--mut);padding:4px 10px;font-size:13px;border:1px solid var(--bd)}
.act .del{color:var(--dng)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.focusbar{display:flex;justify-content:space-between;align-items:center;background:var(--pri2);color:var(--pri);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.focusbar button{background:var(--pri);color:#fff;padding:4px 12px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.f{margin-bottom:10px}
.sheet .btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;min-height:48px;font-weight:700}
.ok{background:var(--pri);color:#fff}.no{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.bc{display:flex;gap:8px}.bc button{background:var(--pri2);color:var(--pri);padding:0 14px;font-weight:700}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#14231f;color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;display:none;z-index:30;max-width:90%;text-align:center}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header><h1 id="ttl"></h1><button class="chip" id="lang"></button></header>
<div id="cam"><video id="vid" playsinline muted></video><div class="frame"></div><button id="camBtn"></button><div id="camMsg"></div></div>
<div class="card"><div class="row">
<div><label id="lW"></label><input id="w" type="number" inputmode="decimal" min="0" step="any" placeholder="kg"></div>
<div><label id="lA"></label><div class="row" style="gap:6px"><input id="a" type="number" inputmode="decimal" min="0" step="any"><select id="au" style="max-width:96px"></select></div></div>
</div></div>
<div class="bar"><input id="q" type="search"><button class="add" id="addBtn"></button></div>
<div id="fb"></div>
<div id="list"></div>
<div class="note" id="disc"></div>
</div>

<div id="modal"><div class="sheet">
<h2 id="mT"></h2>
<div class="f"><label id="lN"></label><input id="fn"></div>
<div class="f"><label id="lB"></label><div class="bc"><input id="fb2" inputmode="numeric"><button id="scanFill"></button></div></div>
<div class="row f"><div><label id="lT"></label><select id="ft"><option value="mgkg">mg/kg</option><option value="mgage">mg/age</option><option value="mlkg">ml/kg</option><option value="mlage">ml/age</option></select></div>
<div><label id="lV"></label><input id="fv" type="number" inputmode="decimal" step="any" min="0"></div></div>
<div class="row f"><div><label id="lC"></label><input id="fc" type="number" inputmode="decimal" step="any" min="0" placeholder="mg/ml"></div>
<div><label id="lF"></label><input id="ff" type="number" inputmode="numeric" min="1" step="1"></div></div>
<div class="btns"><button class="no" id="cancel"></button><button class="ok" id="save"></button></div>
</div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
var T={
ar:{ttl:"حاسبة الجرعات",w:"الوزن (كغم)",a:"العمر",y:"سنة",m:"شهر",q:"ابحث بالاسم أو الباركود",add:"+ دواء",
camOn:"إيقاف الكاميرا",camOff:"تشغيل الكاميرا",scan:"وجّه الكاميرا نحو الباركود",noCam:"الكاميرا غير متاحة. اسمح بالوصول للكاميرا أو اكتب الباركود يدويًا بالبحث.",
mAdd:"إضافة دواء",mEdit:"تعديل الدواء",n:"اسم الدواء",b:"الباركود / QR",t:"نوع الجرعة",v:"الجرعة (للجرعة الواحدة)",c:"التركيز (ملغم لكل مل) – اختياري",f:"عدد المرات باليوم – اختياري",
scanFill:"مسح",cancel:"إلغاء",save:"حفظ",empty:"ماكو أدوية بعد. اضغط ‎+ دواء‎ لإضافة أول دواء.",none:"ماكو نتائج",
needW:"أدخل الوزن لحساب الجرعة",needA:"أدخل العمر لحساب الجرعة",perDose:"للجرعة الواحدة",daily:"المجموع اليومي",times:"مرات/يوم",
del:"حذف",edit:"تعديل",delQ:"تحذف هذا الدواء؟",found:"تم العثور على الدواء",nf:"الباركود غير مسجل، أضفه الآن",got:"تم قراءة الباركود",all:"عرض الكل",need:"اكتب اسم الدواء والجرعة",
disc:"الحاسبة للمساعدة فقط. راجع دائمًا المرجع الدوائي والجرعة القصوى قبل الاستخدام.",lang:"English"},
en:{ttl:"Dose Calculator",w:"Weight (kg)",a:"Age",y:"years",m:"months",q:"Search by name or barcode",add:"+ Drug",
camOn:"Stop camera",camOff:"Start camera",scan:"Point the camera at a barcode",noCam:"Camera unavailable. Allow camera access, or type the barcode in search.",
mAdd:"Add drug",mEdit:"Edit drug",n:"Drug name",b:"Barcode / QR",t:"Dose type",v:"Dose (per single dose)",c:"Concentration (mg per ml) – optional",f:"Times per day – optional",
scanFill:"Scan",cancel:"Cancel",save:"Save",empty:"No drugs yet. Tap + Drug to add your first one.",none:"No results",
needW:"Enter weight to calculate",needA:"Enter age to calculate",perDose:"per dose",daily:"daily total",times:"times/day",
del:"Delete",edit:"Edit",delQ:"Delete this drug?",found:"Drug found",nf:"Barcode not saved, add it now",got:"Barcode read",all:"Show all",need:"Enter drug name and dose",
disc:"For assistance only. Always verify with a drug reference and maximum dose before use.",lang:"العربية"}
};
var $=function(i){return document.getElementById(i)};
var S={lang:"ar",drugs:[],q:"",focus:null,edit:null,cam:true};
try{S.lang=localStorage.getItem("dc_lang")||"ar";S.drugs=JSON.parse(localStorage.getItem("dc_drugs")||"[]");S.w=localStorage.getItem("dc_w")||"";S.a=localStorage.getItem("dc_a")||"";S.au=localStorage.getItem("dc_au")||"y"}catch(e){}
S.w=S.w||"";S.a=S.a||"";S.au=S.au||"y";
function L(k){return T[S.lang][k]}
function save(){try{localStorage.setItem("dc_drugs",JSON.stringify(S.drugs));localStorage.setItem("dc_lang",S.lang);localStorage.setItem("dc_w",S.w);localStorage.setItem("dc_a",S.a);localStorage.setItem("dc_au",S.au)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return (Math.round(n*100)/100).toString()}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2200)}
function ageY(){var a=parseFloat(S.a);if(!(a>0))return 0;return S.au==="m"?a/12:a}

function applyLang(){
var d=document.documentElement;d.lang=S.lang;d.dir=S.lang==="ar"?"rtl":"ltr";
$("ttl").textContent=L("ttl");$("lang").textContent=L("lang");$("lW").textContent=L("w");$("lA").textContent=L("a");
$("au").innerHTML='<option value="y">'+L("y")+'</option><option value="m">'+L("m")+'</option>';$("au").value=S.au;
$("q").placeholder=L("q");$("addBtn").textContent=L("add");$("camBtn").textContent=S.cam?L("camOn"):L("camOff");
$("mT").textContent=S.edit?L("mEdit"):L("mAdd");$("lN").textContent=L("n");$("lB").textContent=L("b");$("lT").textContent=L("t");$("lV").textContent=L("v");$("lC").textContent=L("c");$("lF").textContent=L("f");
$("scanFill").textContent=L("scanFill");$("cancel").textContent=L("cancel");$("save").textContent=L("save");$("disc").textContent=L("disc");
if(!Cam.on)$("camMsg").textContent=Cam.err?L("noCam"):"";else $("camMsg").textContent="";
render();
}

function calc(d){
var kg=d.t.slice(-2)==="kg",base=kg?parseFloat(S.w):ageY();
if(!(base>0))return kg?"w":"a";
var v=d.v*base,mg=null,ml=null;
if(d.t.slice(0,2)==="mg"){mg=v;if(d.c>0)ml=v/d.c}else{ml=v;if(d.c>0)mg=v*d.c}
return{mg:mg,ml:ml,p:d.t.slice(0,2)}
}
function card(d){
var r=calc(d),h="";
if(r==="w")h='<div class="hint">'+L("needW")+'</div>';
else if(r==="a")h='<div class="hint">'+L("needA")+'</div>';
else{
var main=r.p==="mg"?fmt(r.mg)+" mg":fmt(r.ml)+" ml";
var sec=r.p==="mg"?(r.ml!=null?fmt(r.ml)+" ml":""):(r.mg!=null?fmt(r.mg)+" mg":"");
h='<div class="res"><b>'+main+'</b>'+(sec?' <b style="font-size:18px">≈ '+sec+'</b>':'')+'<span>'+L("perDose")+'</span>';
if(d.f>1){var dm=(r.p==="mg"?r.mg:r.ml)*d.f;h+='<span>'+L("daily")+': '+fmt(dm)+(r.p==="mg"?" mg":" ml")+' ('+d.f+' '+L("times")+')</span>'}
h+='</div>';
}
var lab={mgkg:"mg/kg",mgage:"mg/age",mlkg:"ml/kg",mlage:"ml/age"}[d.t];
return '<div class="card drug"><div class="top"><div><div class="nm">'+esc(d.n)+'</div><div class="meta"><span class="tag">'+fmt(d.v)+' '+lab+'</span>'+(d.c>0?' <span class="tag">'+fmt(d.c)+' mg/ml</span>':'')+(d.b?' · '+esc(d.b):'')+'</div></div>'
+'<div class="act"><button data-e="'+d.id+'">'+L("edit")+'</button><button class="del" data-d="'+d.id+'">'+L("del")+'</button></div></div>'+h+'</div>';
}
function render(){
var q=S.q.trim().toLowerCase(),list=S.drugs;
if(S.focus){list=list.filter(function(d){return d.id===S.focus});
$("fb").innerHTML='<div class="focusbar"><span>'+L("found")+'</span><button id="showAll">'+L("all")+'</button></div>';
var b=$("showAll");if(b)b.onclick=function(){S.focus=null;render()};
}else{$("fb").innerHTML="";
if(q)list=list.filter(function(d){return d.n.toLowerCase().indexOf(q)>-1||(d.b||"").toLowerCase().indexOf(q)>-1})}
$("list").innerHTML=list.length?list.map(card).join(""):'<div class="empty">'+(S.drugs.length?L("none"):L("empty"))+'</div>';
}

$("list").addEventListener("click",function(e){
var t=e.target;
if(t.dataset.e)openModal(t.dataset.e);
if(t.dataset.d&&confirm(L("delQ"))){S.drugs=S.drugs.filter(function(d){return d.id!==t.dataset.d});save();render()}
});
$("w").value=S.w;$("a").value=S.a;
$("w").oninput=function(){S.w=this.value;save();render()};
$("a").oninput=function(){S.a=this.value;save();render()};
$("au").onchange=function(){S.au=this.value;save();render()};
$("q").oninput=function(){S.q=this.value;S.focus=null;render()};
$("lang").onclick=function(){S.lang=S.lang==="ar"?"en":"ar";save();applyLang()};

function openModal(id,code){
S.edit=id||null;var d=id?S.drugs.filter(function(x){return x.id===id})[0]:null;
$("fn").value=d?d.n:"";$("fb2").value=d?d.b||"":(code||"");$("ft").value=d?d.t:"mgkg";$("fv").value=d?d.v:"";$("fc").value=d&&d.c?d.c:"";$("ff").value=d&&d.f?d.f:"";
$("mT").textContent=id?L("mEdit"):L("mAdd");$("modal").classList.add("on");
}
function closeModal(){$("modal").classList.remove("on");S.edit=null}
$("addBtn").onclick=function(){openModal()};
$("cancel").onclick=closeModal;
$("scanFill").onclick=function(){if(!Cam.on)Cam.start();toast(L("scan"))};
$("save").onclick=function(){
var n=$("fn").value.trim(),v=parseFloat($("fv").value);
if(!n||!(v>0)){toast(L("need"));return}
var rec={id:S.edit||String(Date.now()),n:n,b:$("fb2").value.trim(),t:$("ft").value,v:v,c:parseFloat($("fc").value)||0,f:parseInt($("ff").value)||0};
if(S.edit)S.drugs=S.drugs.map(function(x){return x.id===S.edit?rec:x});else S.drugs.unshift(rec);
save();closeModal();render();
};

var Cam={on:false,err:false,stream:null,det:null,last:"",lt:0,busy:false,
start:function(){
var self=this;
if(self.on)return;
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){self.fail();return}
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(s){
self.stream=s;self.on=true;self.err=false;S.cam=true;
$("vid").srcObject=s;$("vid").play().catch(function(){});
$("camMsg").textContent="";$("camBtn").textContent=L("camOn");
try{if("BarcodeDetector"in window)self.det=new BarcodeDetector({formats:["qr_code","ean_13","ean_8","code_128","code_39","upc_a","upc_e","itf","data_matrix"]})}catch(e){self.det=null}
self.loop();
}).catch(function(){self.fail()});
},
fail:function(){this.on=false;this.err=true;$("camMsg").textContent=L("noCam");},
stop:function(){
if(this.stream)this.stream.getTracks().forEach(function(t){t.stop()});
this.stream=null;this.on=false;S.cam=false;$("camMsg").textContent="";$("camBtn").textContent=L("camOff");
},
loop:function(){
var self=this;
if(!self.on)return;
setTimeout(function(){
if(!self.on)return;
var v=$("vid");
if(v.readyState>=2&&!self.busy){
self.busy=true;
if(self.det){self.det.detect(v).then(function(r){if(r&&r.length)self.hit(r[0].rawValue);self.busy=false}).catch(function(){self.busy=false})}
else if(window.jsQR){
var c=self.cv||(self.cv=document.createElement("canvas")),w=v.videoWidth/2|0,h=v.videoHeight/2|0;
if(w&&h){c.width=w;c.height=h;var x=c.getContext("2d",{willReadFrequently:true});x.drawImage(v,0,0,w,h);
var res=jsQR(x.getImageData(0,0,w,h).data,w,h);if(res&&res.data)self.hit(res.data)}
self.busy=false}else self.busy=false;
}
self.loop();
},200);
},
hit:function(code){
var now=Date.now();
if(!code||(code===this.last&&now-this.lt<2500))return;
this.last=code;this.lt=now;
if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
if($("modal").classList.contains("on")){$("fb2").value=code;toast(L("got"));return}
var d=S.drugs.filter(function(x){return x.b===code})[0];
if(d){S.focus=d.id;S.q="";$("q").value="";render();toast(L("found")+": "+d.n)}
else{toast(L("nf"));openModal(null,code)}
}
};
$("camBtn").onclick=function(){Cam.on?Cam.stop():Cam.start()};

applyLang();
Cam.start();
</script>
</body>
</html>
